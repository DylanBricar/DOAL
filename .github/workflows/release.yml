name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run check:web
      - run: go vet ./...
      - run: go test -race ./... -count=1 -timeout=180s

  build:
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, name: doal-linux-amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, name: doal-linux-arm64 }
          - { os: macos-latest, goos: darwin, goarch: amd64, name: doal-macos-amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64, name: doal-macos-arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64, name: doal-windows-amd64, ext: .exe }
          - { os: windows-latest, goos: windows, goarch: arm64, name: doal-windows-arm64, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.name }}${{ matrix.ext }} .
      - name: Generate checksum
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const name = '${{ matrix.name }}${{ matrix.ext }}';
            const data = fs.readFileSync(name);
            fs.writeFileSync(name + '.sha256', crypto.createHash('sha256').update(data).digest('hex') + '  ' + name + '\n');
      - name: Store build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}${{ matrix.ext }}
            ${{ matrix.name }}${{ matrix.ext }}.sha256
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: doal-*
          path: release-assets
          merge-multiple: true
      - name: Combine binary checksums
        run: cat release-assets/*.sha256 | sort > SHA256SUMS
      - name: Attest release binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

  create-release:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute next version
        id: get-version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const versions = releases.filter(r => !r.draft).map(r => r.tag_name)
              .filter(tag => /^v\d+\.\d+\.\d+$/.test(tag))
              .map(tag => tag.slice(1).split('.').map(Number))
              .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
            if (!versions.length) return '1.0.0';
            const latest = versions.at(-1);
            return [latest[0], latest[1], latest[2] + 1].join('.');
      - name: Generate changelog
        id: changelog
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const version = '${{ steps.get-version.outputs.result }}';
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 5
            });
            const previous = releases.find(release => !release.draft)?.tag_name || '';
            let commits = [];
            if (previous) {
              try {
                const { data } = await github.rest.repos.compareCommits({
                  owner: context.repo.owner, repo: context.repo.repo,
                  base: previous, head: context.sha
                });
                commits = data.commits.map(commit => commit.commit.message.split('\n')[0]);
              } catch (error) {
                core.warning('Unable to generate commit list: ' + error.message);
              }
            }
            let body = '## DOAL v' + version + '\n\nBitTorrent seeding test tool.\n\n';
            if (commits.length) body += commits.map(message => '- ' + message).join('\n') + '\n';
            if (previous) body += '\n**Full Changelog**: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/compare/' + previous + '...v' + version + '\n';
            return body;
      - name: Create draft release
        id: create-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_BODY: ${{ steps.changelog.outputs.result }}
        with:
          script: |
            const version = '${{ steps.get-version.outputs.result }}';
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const tag = 'v' + version;
            const existing = releases.find(release => release.draft && release.tag_name === tag);
            if (existing) {
              const { data } = await github.rest.repos.updateRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: existing.id,
                name: 'DOAL ' + tag,
                body: process.env.RELEASE_BODY || '',
                draft: true, prerelease: false,
                target_commitish: context.sha
              });
              return data.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: tag,
              name: 'DOAL ' + tag,
              body: process.env.RELEASE_BODY || '',
              draft: true, prerelease: false, target_commitish: context.sha
            });
            return data.id;

  upload-assets:
    needs: [build, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: doal-*
          path: release-assets
          merge-multiple: true
      - name: Upload binaries and checksums
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const releaseId = ${{ needs.create-release.outputs.release-id }};
            const { data: existing } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: releaseId, per_page: 100
            });
            const files = fs.readdirSync('release-assets').sort();
            for (const name of files) {
              const previous = existing.find(asset => asset.name === name);
              if (previous) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner, repo: context.repo.repo,
                  asset_id: previous.id
                });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: releaseId,
                name, data: fs.readFileSync(path.join('release-assets', name))
              });
            }

  publish:
    needs: [create-release, upload-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release-id }},
              draft: false
            });
